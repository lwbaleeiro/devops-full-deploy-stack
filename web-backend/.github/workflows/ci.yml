name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'web-backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'web-backend/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        cd web-backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    # Docker build example (push commented out for testing environment)
    - name: Build Docker image
      run: |
        cd web-backend
        docker build -t my-registry.azurecr.io/web-backend:${{ github.sha }} .
        # docker push my-registry.azurecr.io/web-backend:${{ github.sha }}
        
    # GitOps repo update example
    - name: Update GitOps Repo
      run: |
        echo "Here the ArgoCD manifest would be updated with the new image tag."
