apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: events-api-secrets
  namespace: events-app
spec:
  refreshInterval: "1h"
  # The ClusterSecretStore is created via Terraform/platform for each env/region
  # and points to the corresponding Key Vault (e.g., kv-uat-us-001)
  secretStoreRef:
    name: uat-us
    kind: ClusterSecretStore
  # The target is the name of the native K8s secret that will be created
  target:
    name: events-api-secrets-k8s
    creationPolicy: Owner
  data:
  - secretKey: COSMOS_CONNECTION_STRING
    remoteRef:
      key: cosmos-connection-string
  - secretKey: REDIS_CONNECTION_STRING
    remoteRef:
      key: redis-connection-string
  - secretKey: RABBITMQ_CONNECTION_STRING
    remoteRef:
      key: rabbitmq-connection-string
  - secretKey: EVENTHUB_CONNECTION_STRING
    remoteRef:
      key: eventhub-connection-string
  - secretKey: STORAGE_CONNECTION_STRING
    remoteRef:
      key: storage-connection-string
